<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Clean Downloader</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181b;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        #result {
            margin-top: 20px;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        .video-box {
            margin-top: 15px;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            background: black;
            margin-bottom: 12px;
        }
        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .action-btn:hover {
            background-color: #059669;
        }
        .images-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .images-grid img {
            width: 100%;
            border-radius: 8px;
            object-fit: cover;
            height: 140px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Чистое скачивание без водяных знаков</p>
        
        <input type="text" id="urlInput" placeholder="Вставь ссылку на TikTok...">
        <button id="downloadBtn">Найти видео</button>

        <div id="status" class="subtitle hidden" style="margin-top: 15px;">Загрузка...</div>
        
        <div id="result" class="hidden">
            <div class="video-box">
                <p id="videoTitle" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;"></p>
                
                <!-- Контейнер видео -->
                <div id="videoContainer" class="hidden">
                    <video id="videoPlayer" controls playsinline></video>
                    <a id="downloadVideoBtn" class="action-btn" href="#" target="_blank">💾 Скачать видео без водяного знака</a>
                </div>

                <!-- Контейнер картинок (если это слайдшоу) -->
                <div id="imagesContainer" class="hidden">
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Слайд-шоу из картинок:</p>
                    <div id="imagesGrid" class="images-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const videoContainer = document.getElementById('videoContainer');
        const imagesContainer = document.getElementById('imagesContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadVideoBtn = document.getElementById('downloadVideoBtn');
        const imagesGrid = document.getElementById('imagesGrid');
        const videoTitle = document.getElementById('videoTitle');

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url.includes('tiktok.com')) {
                alert('Пожалуйста, введи корректную ссылку на TikTok!');
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Обработка ссылки...';
            resultDiv.classList.add('hidden');
            videoContainer.classList.add('hidden');
            imagesContainer.classList.add('hidden');

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    const info = data.data;
                    videoTitle.textContent = info.title || 'TikTok контент';
                    
                    statusDiv.style.display = 'none';
                    resultDiv.classList.remove('hidden');

                    if (info.images && info.images.length > 0) {
                        // Слайдшоу
                        imagesGrid.innerHTML = '';
                        info.images.forEach(imgSrc => {
                            const img = document.createElement('img');
                            img.src = imgSrc;
                            imagesGrid.appendChild(img);
                        });
                        imagesContainer.classList.remove('hidden');
                    } else if (info.play) {
                        // Чистая сборка корректного URL видео без всяких склеек
                        let videoUrl = info.play;
                        if (!videoUrl.startsWith('http')) {
                            videoUrl = 'https://www.tikwm.com' + videoUrl;
                        }

                        videoPlayer.src = videoUrl;
                        downloadVideoBtn.href = videoUrl;
                        videoContainer.classList.remove('hidden');
                    } else {
                        statusDiv.style.display = 'block';
                        statusDiv.textContent = 'Не удалось найти медиа в этом посте.';
                    }
                } else {
                    statusDiv.style.display = 'block';
                    statusDiv.textContent = 'Ошибка API. Проверь правильность ссылки.';
                }
            } catch (err) {
                statusDiv.style.display = 'block';
                statusDiv.textContent = 'Ошибка сети. Проверь интернет.';
                console.error(err);
            }
        });
    </script>
</body>
</html>
