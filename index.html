<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Clean Downloader</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181b;
            --border-color: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        #result {
            margin-top: 20px;
            word-break: break-all;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        .video-box {
            margin-top: 15px;
            text-align: center;
        }
        a.download-btn {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        a.download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Скачивай видео без водяных знаков</p>
        
        <input type="text" id="urlInput" placeholder="Вставь ссылку на TikTok...">
        <button id="downloadBtn">Скачать</button>

        <div id="status" class="subtitle hidden" style="margin-top: 15px;">Загрузка...</div>
        
        <div id="result" class="hidden">
            <div class="video-box">
                <p id="videoTitle" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;"></p>
                <a id="downloadLink" class="download-btn" href="#" target="_blank">💾 Сохранить видео без водяного знака</a>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const downloadLink = document.getElementById('downloadLink');
        const videoTitle = document.getElementById('videoTitle');

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url.includes('tiktok.com')) {
                alert('Пожалуйста, введи корректную ссылку на TikTok!');
                return;
            }

            statusDiv.style.display = 'block';
            statusDiv.textContent = 'Получаем видео...';
            resultDiv.classList.add('hidden');

            try {
                // Прямой запрос к API без всяких перенаправлений
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    const videoData = data.data;
                    videoTitle.textContent = videoData.title || 'Видео TikTok';
                    // Используем прямую ссылку на видео без водяного знака от API
                    downloadLink.href = 'https://www.tikwm.com' + videoData.play;
                    
                    statusDiv.style.display = 'none';
                    resultDiv.classList.remove('hidden');
                } else {
                    statusDiv.textContent = 'Ошибка: не удалось найти видео. Проверь ссылку.';
                }
            } catch (err) {
                statusDiv.textContent = 'Ошибка сети. Попробуй еще раз.';
                console.error(err);
            }
        });
    </script>
</body>
</html>
